name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Initialize/Link Expo Project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔗 Linking Expo project..."
          eas init --account ajugbo --non-interactive
          echo "✅ Project linked."

      - name: Build and Download Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🚀 Starting build..."
          eas build --profile production --platform android --non-interactive --wait
          
          echo "⬇️ Downloading APK..."
          eas build:download --latest --platform android --output ./driver-radar.apk
          echo "✅ APK downloaded to ./driver-radar.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-android-apk
          path: mobile/driver-radar.apk
