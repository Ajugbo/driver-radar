name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd mobile
          npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Fetch Expo Project ID
        id: fetch_id
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd mobile
          echo "🔍 Fetching project ID from Expo API..."
          RESPONSE=$(curl -s -X POST https://expo.dev/api/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -d '{"query": "query { app { byAccountNameAndSlug(accountName: \"ajugbo\", slug: \"driver-radar\") { id } } }"}')
          
          PROJECT_ID=$(echo $RESPONSE | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" == "null" ]; then
            echo "⚠️ API did not return ID. Attempting to link/create via eas init..."
            eas init --account ajugbo --non-interactive || true
            PROJECT_ID=$(grep -o '"projectId": *"[^"]*"' app.json | head -1 | cut -d'"' -f4)
          fi
          
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "✅ Found Project ID: $PROJECT_ID"

      - name: Inject Project ID into app.json
        run: |
          cd mobile
          node - <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));

          app.expo.extra ??= {};
          app.expo.extra.eas ??= {};
          app.expo.extra.eas.projectId = process.env.PROJECT_ID;

          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('✅ Injected EAS project ID:', process.env.PROJECT_ID);
          NODE

      - name: Build Android APK
        run: |
          cd mobile
          eas build --profile production --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-android
          path: mobile/*.apk
