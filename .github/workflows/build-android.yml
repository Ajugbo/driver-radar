name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Initialize/Link Expo Project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔗 Linking or creating Expo project..."
          eas init --account ajugbo --non-interactive
          
          # Verify that projectId was successfully added to app.json
          PROJECT_ID=$(node -e "console.log(require('./app.json').expo?.extra?.eas?.projectId || '')")
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "::error::Failed to get Project ID after eas init."
            exit 1
          fi
          echo "✅ Successfully configured Project ID: $PROJECT_ID"

      - name: Build Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile production --platform android --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-android
          path: mobile/*.apk
