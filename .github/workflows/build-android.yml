name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Fetch Project ID from Expo and Inject
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node -e "
            const https = require('https');
            const fs = require('fs');

            const data = JSON.stringify({
              query: 'query { app { byAccountNameAndSlug(accountName: \"ajugbo\", slug: \"driver-radar\") { id } } }'
            });

            const options = {
              hostname: 'expo.dev',
              path: '/api/graphql',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + process.env.EXPO_TOKEN
              }
            };

            const req = https.request(options, (res) => {
              let body = '';
              res.on('data', (chunk) => body += chunk);
              res.on('end', () => {
                const json = JSON.parse(body);
                const id = json?.data?.app?.byAccountNameAndSlug?.id;
                if (!id) {
                  console.error('Failed to get ID:', body);
                  process.exit(1);
                }
                console.log('✅ Found Project ID:', id);
                
                const app = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
                app.expo.extra = app.expo.extra || {};
                app.expo.extra.eas = app.expo.extra.eas || {};
                app.expo.extra.eas.projectId = id;
                fs.writeFileSync('./app.json', JSON.stringify(app, null, 2));
              });
            });
            req.write(data);
            req.end();
          "

      - name: Build Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile production --platform android --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-android
          path: mobile/*.apk
