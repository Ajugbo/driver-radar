      - name: Verify Manifest Content
        if: always()
        continue-on-error: true
        run: |
          echo "=== MANIFEST DIAGNOSTIC ==="
          # The APK is in the artifact directory created by the previous step
          ls -la mobile/artifact/ || echo "No artifact directory found in mobile/"
          unzip -p mobile/artifact/*.apk AndroidManifest.xml > /tmp/manifest.bin 2>/dev/null || echo "Failed to extract manifest"
          strings -e l /tmp/manifest.bin | grep -iE "intent|scheme|oauth|driverradar" | head -20 || echo "No relevant strings found"
          echo "========================="
