name: Build Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://driver-radar.vercel.app
      EXPO_PUBLIC_LETZGO_API_URL: https://letsgo-backend-one.vercel.app
      GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Debug APK
        working-directory: .
        run: |
          cd mobile

          # Clean prebuild regenerates the Android project from Expo config
          npx expo prebuild --platform android --clean --no-install

          # Force inject OAuth intent filter directly into generated manifest
          # Uses simple string search instead of regex; removes stale refs first
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            
            try {
              let xml = fs.readFileSync(path, "utf8");
              
              // ALWAYS remove stale/orphaned oauthredirect references first
              if (xml.includes("oauthredirect")) {
                xml = xml.replace(/<intent-filter[^>]*>[\s\S]*?oauthredirect[\s\S]*?<\/intent-filter>/g, "");
                console.log("🧹 Removed stale oauthredirect reference");
              }
              
              // Find last </activity> tag using simple string search
              const activityCloseTag = "</activity>";
              const lastActivityIndex = xml.lastIndexOf(activityCloseTag);
              
              if (lastActivityIndex === -1) {
                throw new Error("No </activity> tag found in manifest");
              }
              
              const filter = `\n        <intent-filter android:autoVerify="true">\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:scheme="com.ajugbo.driverradar" android:host="oauthredirect" />\n        </intent-filter>`;
              
              xml = xml.substring(0, lastActivityIndex) + filter + xml.substring(lastActivityIndex);
              fs.writeFileSync(path, xml);
              console.log("✅ Injected OAuth intent filter after last </activity> tag");
              
            } catch (err) {
              console.error("❌ Manifest injection failed:", err.message);
              // Print first 50 lines of manifest for debugging
              const lines = fs.readFileSync(path, "utf8").split("\n").slice(0, 50).join("\n");
              console.error("Manifest preview:\n", lines);
              process.exit(1);
            }
          '

          # Generate production bundle into assets
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          # Build with Hermes + ARM64
          cd android
          ./gradlew assembleDebug --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pexpo.jsEngine=hermes

      - name: Find and Prepare APK
        run: |
          mkdir -p ../artifact
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} ../artifact/ \;
          echo "APK files found:"
          ls -lah ../artifact

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-debug-apk
          path: artifact/*.apk
          if-no-files-found: error