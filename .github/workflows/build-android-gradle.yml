      - name: Verify Manifest Content
        if: always()
        continue-on-error: true
        run: |
          echo "=== MANIFEST DIAGNOSTIC ==="
          # Check if the prebuild generated the manifest
          if [ -f mobile/android/app/src/main/AndroidManifest.xml ]; then
            echo "✅ Manifest found. Checking for oauthredirect..."
            grep -iE "intent|scheme|oauth|driverradar|view|browsable" mobile/android/app/src/main/AndroidManifest.xml | head -30
          else
            echo "❌ Manifest not found in mobile/android/app/src/main/"
            echo "Listing mobile directory contents:"
            ls -la mobile/
          fi
          echo "========================="
