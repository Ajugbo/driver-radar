name: Build Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://driver-radar.vercel.app
      EXPO_PUBLIC_LETZGO_API_URL: https://letsgo-backend-one.vercel.app
      GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Debug APK
        working-directory: .
        run: |
          cd mobile

          # Clean prebuild regenerates the Android project from Expo config
          npx expo prebuild --platform android --clean --no-install

          # Force inject OAuth intent filter directly into generated manifest
          # Uses XML tag depth tracking to guarantee placement INSIDE MainActivity
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";

            function fail(message, xml) {
              console.error("❌ Manifest injection failed:", message);
              if (xml !== null) {
                console.error("Manifest preview:\n" + xml.split("\n").slice(0, 100).join("\n"));
              }
              process.exit(1);
            }

            try {
              let xml = fs.readFileSync(path, "utf8");

              // ALWAYS remove stale/orphaned oauthredirect references first
              if (xml.includes("oauthredirect")) {
                xml = xml.replace(/<intent-filter[^>]*>[\s\S]*?oauthredirect[\s\S]*?<\/intent-filter>/g, "");
                console.log("🧹 Removed stale oauthredirect reference");
              }

              const mainActivityOpenTag = /<activity(?=\s|>)(?=[^>]*\bandroid:name\s*=\s*"(?:\.MainActivity|com\.ajugbo\.driverradar\.MainActivity)")[^>]*>/g;
              const match = mainActivityOpenTag.exec(xml);

              if (!match) {
                fail("MainActivity was not found", xml);
              }

              const activityTags = /<\/?activity(?=\s|>)[^>]*>/g;
              activityTags.lastIndex = mainActivityOpenTag.lastIndex;
              let depth = 1;
              let closingIndex = -1;
              let tag;

              while ((tag = activityTags.exec(xml)) !== null) {
                if (/^<\/activity/.test(tag[0])) {
                  depth--;
                  if (depth === 0) {
                    closingIndex = tag.index;
                    break;
                  }
                } else if (!/\/\s*>$/.test(tag[0])) {
                  depth++;
                }
              }

              if (closingIndex === -1) {
                fail("MainActivity closing </activity> tag was not found", xml);
              }

              const filter = `
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.ajugbo.driverradar" android:host="oauthredirect" />
                  </intent-filter>`;

              xml = xml.slice(0, closingIndex) + filter + "\n    " + xml.slice(closingIndex);
              fs.writeFileSync(path, xml);
              console.log("✅ Injected OAuth intent filter inside MainActivity");
            } catch (err) {
              let xml = null;
              try {
                xml = fs.readFileSync(path, "utf8");
              } catch {}
              fail(err.message, xml);
            }
          '

          # Generate production bundle into assets
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          # Build with Hermes + ARM64
          cd android
          ./gradlew assembleDebug --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pexpo.jsEngine=hermes

      - name: Find and Prepare APK
        run: |
          mkdir -p ../artifact
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} ../artifact/ \;
          echo "APK files found:"
          ls -lah ../artifact

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-debug-apk
          path: artifact/*.apk
          if-no-files-found: error