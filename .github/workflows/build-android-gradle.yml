name: Build Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://driver-radar.vercel.app
      EXPO_PUBLIC_LETZGO_API_URL: https://letsgo-backend-one.vercel.app
      GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Debug APK
        working-directory: .
        run: |
          cd mobile

          # Clean prebuild regenerates the Android project from Expo config
          npx expo prebuild --platform android --clean --no-install

          # Force inject OAuth intent filter directly into generated manifest
          # Targets LAST </activity> before </application> to ensure MainActivity placement
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(path, "utf8");
            
            if (!xml.includes("oauthredirect") && xml.includes("com.ajugbo.driverradar.MainActivity")) {
              const appEndIndex = xml.lastIndexOf("</application>");
              const activityCloseIndex = xml.lastIndexOf("</activity>", appEndIndex);
              
              if (activityCloseIndex !== -1) {
                const filter = `\n        <intent-filter android:autoVerify="true">\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:scheme="com.ajugbo.driverradar" android:host="oauthredirect" />\n        </intent-filter>`;
                
                xml = xml.substring(0, activityCloseIndex) + filter + xml.substring(activityCloseIndex);
                fs.writeFileSync(path, xml);
                console.log("✅ Injected OAuth intent filter into MainActivity");
              } else {
                console.error("❌ Could not locate MainActivity closing tag");
                process.exit(1);
              }
            } else if (xml.includes("oauthredirect")) {
              console.log("ℹ️ OAuth intent filter already present");
            } else {
              console.error("❌ MainActivity not found in manifest");
              process.exit(1);
            }
          '

          # Generate production bundle into assets
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          # Build with Hermes + ARM64
          cd android
          ./gradlew assembleDebug --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pexpo.jsEngine=hermes

      - name: Find and Prepare APK
        run: |
          mkdir -p ../artifact
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} ../artifact/ \;
          echo "APK files found:"
          ls -lah ../artifact

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-debug-apk
          path: artifact/*.apk
          if-no-files-found: error