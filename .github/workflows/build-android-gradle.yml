      - name: Print APK SHA-1 Fingerprint
        if: always()
        run: |
          echo "=== APK SHA-1 FINGERPRINT ==="
          # Check both possible artifact paths
          if [ -f artifact/app-debug.apk ]; then
            keytool -printcert -jarfile artifact/app-debug.apk | grep -i "SHA1:" || echo "Failed to extract SHA-1"
          elif [ -f mobile/artifact/app-debug.apk ]; then
            keytool -printcert -jarfile mobile/artifact/app-debug.apk | grep -i "SHA1:" || echo "Failed to extract SHA-1"
          else
            echo "APK not found to check SHA-1"
          fi
          echo "============================="
