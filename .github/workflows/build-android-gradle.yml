name: Build Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Debug APK
        working-directory: .
        run: |
          cd mobile

          # Clean prebuild regenerates the Android project from Expo config
          npx expo prebuild --platform android --clean --no-install

          # Generate production bundle into assets
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          # Build with Hermes + ARM64
          cd android
          ./gradlew assembleDebug --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pexpo.jsEngine=hermes

      - name: Find and Prepare APK
        run: |
          mkdir -p ../artifact
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} ../artifact/ \;
          echo "APK files found:"
          ls -lah ../artifact

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-radar-debug-apk
          path: artifact/*.apk
          if-no-files-found: error
